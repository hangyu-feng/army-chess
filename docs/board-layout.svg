<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">四国军棋 standard board layout</title>
  <desc id="desc">A top-down four-country Army Chess board with four 30-position zones, a nine-station central palace, camps, headquarters, road edges, and railway edges.</desc>
  <style>
    .board { fill: #fff; stroke: #222; stroke-width: 2; }
    .zone { fill: #fafafa; stroke: #aaa; stroke-width: 1; }
    .rail { stroke: #222; stroke-width: 3; fill: none; }
    .road { stroke: #888; stroke-width: 1.5; fill: none; }
    .node { fill: #fff; stroke: #222; stroke-width: 1.5; }
    .camp { fill: #e8e8e8; }
    .hq { fill: #f4df9b; }
    .palace { fill: #f7f7f7; stroke: #222; stroke-width: 1.5; }
    .label { fill: #222; font-family: sans-serif; font-size: 18px; font-weight: 600; text-anchor: middle; }
    .small { fill: #555; font-family: sans-serif; font-size: 13px; text-anchor: middle; }
    .node-label { fill: #333; font-family: sans-serif; font-size: 9px; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <rect class="board" x="20" y="20" width="960" height="960" rx="2" />

  <!-- One country in its local orientation: row 1 is the front row. -->
  <defs>
  <g id="country-template">
    <rect class="zone" x="-18" y="-18" width="224" height="271" />
    <g class="rail">
      <path d="M0 0H188 M0 188H188" />
      <path d="M0 0V188 M188 0V188" />
    </g>
    <g class="road">
      <path d="M0 47H188 M0 94H188 M0 141H188 M0 235H188" />
      <path d="M0 188V235 M188 188V235 M47 0V235 M94 0V235 M141 0V235" />
      <path d="M0 0L47 47 M94 0L47 47 M188 0L141 47 M94 0L141 47" />
      <path d="M0 94L47 47 M94 94L47 47 M188 94L141 47 M94 94L141 47" />
      <path d="M0 94L47 141 M94 94L47 141 M188 94L141 141 M94 94L141 141" />
      <path d="M0 188L47 141 M94 188L47 141 M188 188L141 141 M94 188L141 141" />
      <path d="M47 47L94 94 M141 47L94 94 M47 141L94 94 M141 141L94 94" />
    </g>
    <g>
      <!-- row 1 -->
      <circle class="node" cx="0" cy="0" r="9" /><circle class="node" cx="47" cy="0" r="9" />
      <circle class="node" cx="94" cy="0" r="9" /><circle class="node" cx="141" cy="0" r="9" />
      <circle class="node" cx="188" cy="0" r="9" />
      <!-- row 2 -->
      <circle class="node" cx="0" cy="47" r="9" /><circle class="node camp" cx="47" cy="47" r="9" />
      <circle class="node" cx="94" cy="47" r="9" /><circle class="node camp" cx="141" cy="47" r="9" />
      <circle class="node" cx="188" cy="47" r="9" />
      <!-- row 3 -->
      <circle class="node" cx="0" cy="94" r="9" /><circle class="node" cx="47" cy="94" r="9" />
      <circle class="node camp" cx="94" cy="94" r="9" /><circle class="node" cx="141" cy="94" r="9" />
      <circle class="node" cx="188" cy="94" r="9" />
      <!-- row 4 -->
      <circle class="node" cx="0" cy="141" r="9" /><circle class="node camp" cx="47" cy="141" r="9" />
      <circle class="node" cx="94" cy="141" r="9" /><circle class="node camp" cx="141" cy="141" r="9" />
      <circle class="node" cx="188" cy="141" r="9" />
      <!-- row 5 -->
      <circle class="node" cx="0" cy="188" r="9" /><circle class="node" cx="47" cy="188" r="9" />
      <circle class="node" cx="94" cy="188" r="9" /><circle class="node" cx="141" cy="188" r="9" />
      <circle class="node" cx="188" cy="188" r="9" />
      <!-- row 6 -->
      <circle class="node" cx="0" cy="235" r="9" /><circle class="node hq" cx="47" cy="235" r="9" />
      <circle class="node" cx="94" cy="235" r="9" /><circle class="node hq" cx="141" cy="235" r="9" />
      <circle class="node" cx="188" cy="235" r="9" />
    </g>
  </g>
  </defs>

  <!-- South: front row toward the nine-palace. Other zones are rotations of it. -->
  <use href="#country-template" transform="translate(406 648)" />
  <g transform="rotate(180 500 500)"><use href="#country-template" transform="translate(406 648)" /></g>
  <g transform="rotate(-90 500 500)"><use href="#country-template" transform="translate(406 648)" /></g>
  <g transform="rotate(90 500 500)"><use href="#country-template" transform="translate(406 648)" /></g>

  <!-- Nine-palace: every line in this 3x3 graph is railway. -->
  <g>
    <rect class="palace" x="410" y="410" width="180" height="180" />
  </g>
  <g class="rail">
    <path d="M410 410H590 M410 500H590 M410 590H590" />
    <path d="M410 410V590 M500 410V590 M590 410V590" />
  </g>
  <g>
    <circle class="node" cx="410" cy="410" r="10" /><circle class="node" cx="500" cy="410" r="10" /><circle class="node" cx="590" cy="410" r="10" />
    <circle class="node" cx="410" cy="500" r="10" /><circle class="node" cx="500" cy="500" r="10" /><circle class="node" cx="590" cy="500" r="10" />
    <circle class="node" cx="410" cy="590" r="10" /><circle class="node" cx="500" cy="590" r="10" /><circle class="node" cx="590" cy="590" r="10" />
    <text class="node-label" x="410" y="410">NW</text><text class="node-label" x="500" y="410">N</text><text class="node-label" x="590" y="410">NE</text>
    <text class="node-label" x="410" y="500">W</text><text class="node-label" x="500" y="500">C</text><text class="node-label" x="590" y="500">E</text>
    <text class="node-label" x="410" y="590">SW</text><text class="node-label" x="500" y="590">S</text><text class="node-label" x="590" y="590">SE</text>
  </g>

  <!-- Railway interfaces between the nine-palace and the four fronts. -->
  <g class="rail">
    <path d="M410 410L406 352 M500 410V352 M590 410L594 352" />
    <path d="M590 410L648 406 M590 500H648 M590 590L648 594" />
    <path d="M590 590L594 648 M500 590V648 M410 590L406 648" />
    <path d="M410 590L352 594 M410 500H352 M410 410L352 406" />
  </g>

  <!-- Railway links between neighboring country fronts. -->
  <g class="rail">
    <path d="M594 352L648 406 M406 352L352 406 M648 594L594 648 M352 594L406 648" />
  </g>

  <text class="label" x="500" y="58">NORTH</text>
  <text class="label" x="942" y="505">EAST</text>
  <text class="label" x="500" y="947">SOUTH</text>
  <text class="label" x="58" y="505">WEST</text>
  <text class="small" x="500" y="388">nine-palace / 九宫</text>

  <g transform="translate(80 965)">
    <line class="rail" x1="0" y1="0" x2="42" y2="0" /><text class="small" x="68" y="5">railway</text>
    <line class="road" x1="155" y1="0" x2="197" y2="0" /><text class="small" x="223" y="5">road</text>
    <circle class="node camp" cx="310" cy="0" r="8" /><text class="small" x="350" y="5">camp</text>
    <circle class="node hq" cx="430" cy="0" r="8" /><text class="small" x="465" y="5">HQ</text>
  </g>
</svg>
